<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#063E52"></stop>
      <stop offset="58%" stop-color="#087A87"></stop>
      <stop offset="100%" stop-color="#18A78F"></stop>
    </linearGradient>

    <!-- Gold accent -->
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7D975"></stop>
      <stop offset="100%" stop-color="#E8B94C"></stop>
    </linearGradient>

    <!-- Soft glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#002A35" flood-opacity="0.22"></feDropShadow>
    </filter>

    <clipPath id="portraitClip">
      <circle cx="1250" cy="430" r="250"></circle>
    </clipPath>
  </defs>

  <!-- ====================== -->
  <!-- BACKGROUND -->
  <!-- ====================== -->

  <rect width="1600" height="900" fill="url(#bgGradient)"></rect>

  <!-- Decorative background glow -->
  <circle cx="1320" cy="380" r="450" fill="url(#glow)"></circle>

  <!-- Large soft water curves -->
  <path d="
      M0 720
      C220 635 400 770 620 710
      C870 640 1030 760 1260 700
      C1410 662 1510 615 1600 630
      L1600 900
      L0 900 Z" fill="#FFFFFF" opacity="0.055"></path>

  <path d="
      M0 785
      C250 700 430 850 700 775
      C950 705 1140 845 1370 760
      C1460 725 1530 710 1600 720" fill="none" stroke="#88DED1" stroke-width="4" opacity="0.20"></path>

  <!-- Floating science dots -->
  <circle cx="106" cy="120" r="7" fill="#F4CF68" opacity=".85"></circle>
  <circle cx="145" cy="92" r="3" fill="#FFFFFF" opacity=".65"></circle>
  <circle cx="1550" cy="135" r="9" fill="#F4CF68" opacity=".55"></circle>
  <circle cx="1495" cy="85" r="4" fill="#FFFFFF" opacity=".5"></circle>

  <!-- ====================== -->
  <!-- LEFT CONTENT -->
  <!-- ====================== -->

  <!-- Top mini brand -->
  <text x="100" y="92" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="3" fill="#FFFFFF">
    WASMaN
  </text>

  <line x1="100" y1="111" x2="166" y2="111" stroke="#F2CB64" stroke-width="5" stroke-linecap="round"></line>

  <!-- Knowledge icon -->
  <g transform="translate(100 170)">
    <circle cx="52" cy="52" r="52" fill="#FFFFFF" opacity=".13"></circle>

    <!-- Open book -->
    <path d="M23 38
             C37 32 48 34 55 40
             L55 73
             C47 67 36 64 23 68 Z" fill="none" stroke="#F8DC84" stroke-width="4" stroke-linejoin="round"></path>

    <path d="M87 38
             C73 32 62 34 55 40
             L55 73
             C63 67 74 64 87 68 Z" fill="none" stroke="#F8DC84" stroke-width="4" stroke-linejoin="round"></path>

    <!-- Person / reader -->
    <circle cx="55" cy="25" r="8" fill="#FFFFFF"></circle>
    <path d="M41 38
             C43 29 48 27 55 27
             C62 27 67 29 69 38" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></path>
  </g>

  <!-- Kicker -->
  <rect x="100" y="305" rx="18" ry="18" width="245" height="45" fill="#F3CF67"></rect>

  <text x="222" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="1.3" fill="#064657">
    WOMEN IN SCIENCE
  </text>

  <!-- Main title -->
  <text x="100" y="440" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="800" fill="#FFFFFF">
    Knowledge
  </text>

  <text x="100" y="520" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="800" fill="#F5D36F">
    Bite
  </text>

  <!-- Highlight rule -->
  <rect x="100" y="554" width="86" height="7" rx="3.5" fill="#F5D36F"></rect>

  <!-- Paragraph -->
  <text x="100" y="620" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#EAF8F7" font-weight="400">

    <tspan x="100" dy="0">
      Women in aquatic science are making a difference.
    </tspan>

    <tspan x="100" dy="42">
      Through research, mentorship and community
    </tspan>

    <tspan x="100" dy="42">
      engagement, WASMaN members are promoting the
    </tspan>

    <tspan x="100" dy="42">
      sustainable management of aquatic resources —
    </tspan>

    <tspan x="100" dy="42">
      inspiring more girls and women to pursue careers
    </tspan>

    <tspan x="100" dy="42">
      in science and environmental conservation.
    </tspan>

  </text>

  <!-- ====================== -->
  <!-- RIGHT VISUAL -->
  <!-- ====================== -->

  <!-- Portrait background circle -->
  <circle cx="1250" cy="430" r="275" fill="#FFFFFF" opacity=".08"></circle>

  <circle cx="1250" cy="430" r="245" fill="#E7FAF6" opacity=".96" filter="url(#shadow)"></circle>

  <!-- Woman scientist illustration -->
  <g clip-path="url(#portraitClip)">

    <!-- Background aquatic pattern -->
    <path d="M1000 570
             C1090 515 1150 545 1240 510
             C1340 470 1425 525 1500 475
             L1500 720
             L980 720 Z" fill="#8DD9CF" opacity=".5"></path>

    <!-- Hair -->
    <ellipse cx="1260" cy="318" rx="91" ry="105" fill="#253B40"></ellipse>

    <!-- Neck -->
    <rect x="1229" y="380" width="63" height="69" rx="20" fill="#9C633F"></rect>

    <!-- Face -->
    <ellipse cx="1260" cy="332" rx="64" ry="78" fill="#B97950"></ellipse>

    <!-- Ear -->
    <circle cx="1199" cy="340" r="13" fill="#B97950"></circle>
    <circle cx="1321" cy="340" r="13" fill="#B97950"></circle>

    <!-- Hairline -->
    <path d="M1198 308
             C1207 245 1252 228 1296 253
             C1337 276 1330 324 1320 334
             C1317 280 1280 283 1264 267
             C1242 295 1213 295 1198 308Z" fill="#253B40"></path>

    <!-- Eyes -->
    <circle cx="1235" cy="333" r="4.5" fill="#20353A"></circle>
    <circle cx="1286" cy="333" r="4.5" fill="#20353A"></circle>

    <!-- Nose -->
    <path d="M1261 341
             C1258 351 1257 356 1264 358" fill="none" stroke="#7C4933" stroke-width="3" stroke-linecap="round"></path>

    <!-- Smile -->
    <path d="M1242 372
             C1253 382 1272 382 1283 371" fill="none" stroke="#713B35" stroke-width="4" stroke-linecap="round"></path>

    <!-- Shirt -->
    <path d="M1120 610
             C1135 475 1190 423 1261 423
             C1337 423 1390 476 1404 610
             L1420 720
             L1100 720 Z" fill="#087988"></path>

    <!-- Lab coat -->
    <path d="M1185 442
             L1240 430
             L1254 720
             L1100 720
             L1120 545
             C1135 490 1155 460 1185 442Z" fill="#FFFFFF"></path>

    <path d="M1337 442
             L1283 430
             L1267 720
             L1420 720
             L1401 545
             C1388 491 1367 460 1337 442Z" fill="#F5FAFA"></path>

    <!-- Collar -->
    <path d="M1214 438 L1259 475 L1233 516 L1186 446 Z" fill="#DDEFF0"></path>
    <path d="M1307 438 L1261 475 L1288 516 L1336 446 Z" fill="#DDEFF0"></path>

    <!-- Necklace / science pendant -->
    <circle cx="1261" cy="511" r="10" fill="#EABB52"></circle>

    <!-- Clipboard -->
    <g transform="rotate(-8 1370 530)">
      <rect x="1312" y="480" width="110" height="148" rx="12" fill="#F6D576"></rect>

      <rect x="1345" y="468" width="45" height="18" rx="8" fill="#FFFFFF"></rect>

      <line x1="1335" y1="520" x2="1400" y2="520" stroke="#317982" stroke-width="5" stroke-linecap="round"></line>

      <line x1="1335" y1="545" x2="1395" y2="545" stroke="#317982" stroke-width="5" stroke-linecap="round"></line>

      <line x1="1335" y1="570" x2="1382" y2="570" stroke="#317982" stroke-width="5" stroke-linecap="round"></line>
    </g>

  </g>

  <!-- Decorative orbital/science elements -->
  <ellipse cx="1260" cy="430" rx="330" ry="115" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".22" transform="rotate(-18 1260 430)"></ellipse>

  <circle cx="956" cy="519" r="10" fill="#F5D36F"></circle>

  <circle cx="1500" cy="334" r="7" fill="#F5D36F"></circle>

  <!-- Small water / molecule motif -->
  <g opacity=".65">
    <line x1="1440" y1="610" x2="1492" y2="580" stroke="#FFFFFF" stroke-width="3"></line>
    <line x1="1492" y1="580" x2="1530" y2="620" stroke="#FFFFFF" stroke-width="3"></line>

    <circle cx="1440" cy="610" r="9" fill="#F7D975"></circle>

    <circle cx="1492" cy="580" r="12" fill="#FFFFFF"></circle>

    <circle cx="1530" cy="620" r="8" fill="#F7D975"></circle>
  </g>

  <!-- ====================== -->
  <!-- FOOTER -->
  <!-- ====================== -->

  <text x="1195" y="805" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#FFFFFF" opacity=".85">
    SCIENCE • LEADERSHIP • IMPACT
  </text>

  <!-- Carousel indicator -->
  <g transform="translate(1425 840)">
    <circle cx="0" cy="0" r="5" fill="#F5D36F"></circle>
    <circle cx="20" cy="0" r="5" fill="#FFFFFF" opacity=".35"></circle>
    <circle cx="40" cy="0" r="5" fill="#FFFFFF" opacity=".35"></circle>
  </g>

</svg>